name: Auto-Deploy AI Platform
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Tests
        run: |
          if [ -d tests ]; then pytest tests/ -v --tb=short; else echo "No tests defined"; fi
      - name: Deployment Status
        run: echo "✅ AI Platform Verified & Ready"
